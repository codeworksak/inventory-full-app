apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cart-redis
  namespace: inventory-cart
  labels:
    app: cart-redis
spec:
  serviceName: cart-redis-service
  replicas: 1
  selector:
    matchLabels:
      app: cart-redis
  template:
    metadata:
      labels:
        app: cart-redis
    spec:
      containers:
        - name: cart-redis-container
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resiyrces:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"      