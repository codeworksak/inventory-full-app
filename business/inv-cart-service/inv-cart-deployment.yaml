apiVersion: apps/v1
kind: Deployment
metadata:
  name: inv-cart-deployment
  namespace: inventory-cart
  labels:
    app: inv-cart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inv-cart
  template:
    metadata:
      labels:
        app: inv-cart
    spec:
      containers:
        - name: inv-cart-container
          image: codeworksak/inventory-cart:v1
          ports:
            - containerPort: 8082
          env:
            - name: REDIS_HOST
              value: cart-redis-service
            - name: REDIS_PORT
              value: "6379"
            - name: RABBIT_HOST
              value: "inv-rabbitmq-svc.inventory-infrastructure.svc.cluster.local"
            - name: RABBIT_PORT
              value: "5672"
            - name: RABBIT_USER
              value: "guest"
            - name: RABBIT_PASS
              value: "guest"
            - name: RABBIT_ORD_Q
              value: "order-queue"
            - name: RABBIT_EXCHANGE
              value: "fanout.ordering"
            - name: RABBIT_ROUTE_KEY
              value: "ordering"    
