apiVersion: v1
kind: PersistentVolume
metadata:
  name: inventory-pv
  namespace: inv-infrastructure
  labels: 
    app: inventory-pg-db
spec:
  capacity:
    storage: 200Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: local-storage
  local:
    path: /mnt/inv-postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - inventory-app-worker2  



