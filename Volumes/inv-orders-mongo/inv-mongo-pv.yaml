apiVersion: v1
kind: PersistentVolume
metadata:
  name: order-mongo-pv
  namespace: inv-infrastructure
  labels: 
    app: order-mongo
spec:
  capacity:
    storage: 200Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: local-storage
  local:
    path: /mnt/inv-mongodata
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - inventory-app-worker2  



