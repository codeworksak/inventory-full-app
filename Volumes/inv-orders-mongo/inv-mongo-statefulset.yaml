apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: order-mongo
  namespace: inventory-infrastructure
  labels:
    app: order-mongo
spec:
  serviceName: order-mongo-service
  replicas: 1
  selector:
    matchLabels:
      app: order-mongo
  template:
    metadata:
      labels: 
        app: order-mongo
    spec:
      containers:
        - name: order-mongo-container
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: order-mongo-storage
              mountPath: /data/db
      volumes:
        - name: order-mongo-storage
          persistentVolumeClaim:
            claimName: order-mongo-pvc