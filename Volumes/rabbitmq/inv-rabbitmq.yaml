apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: inv-rabbitmq
  labels:
    app: inventory-app
spec:
  serviceName: inv-rabbitmq-svc
  replicas: 1
  selector:
    matchLabels:
      app: inv-broker 
  template:
    metadata:
      labels:
        app: inv-broker
    spec:
      containers:
        - name: inv-rabbitmq
          image: rabbitmq:4-management
          ports:
            - containerPort: 5672
              name: rabbitmq-port
            - containerPort: 15672
              name: rabbitmq-mgmt
          volumeMounts:
            - name: inv-rabbitmq-storage
              mountPath: /var/lib/rabbitmq
      volumes:
        - name: inv-rabbitmq-storage
          persistentVolumeClaim:
            claimName: inv-rabbitmq-pvc
