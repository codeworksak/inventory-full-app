apiVersion: v1
kind: PersistentVolume
metadata:
  name: inv-rabbitmq-pv
  namespace: infrastructure
  labels: 
    app: inventory-app
spec:
  capacity:
    storage: 200Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: local-storage
  local:
    path: /mnt/inv-rabbitmq
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - inventory-app-worker2  


